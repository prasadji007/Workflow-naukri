name: Update Naukri Resume for ProfileMAIN

on:
  schedule:
    - cron: '0 3 * * *'    # 8:30 AM IST  — morning recruiter peak
    - cron: '30 8 * * *'   # 2:00 PM IST  — post-lunch peak
    - cron: '0 13 * * *'   # 6:30 PM IST  — evening peak
  workflow_dispatch:

jobs:
  upload-resume:
    runs-on: naukri-ec2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload resume to Naukri
        uses: Prateek-Wayne/naukri-resume-action@v1.0.1
        with:
          username: ${{ secrets.NAUKRI_USERNAME_MAIN }}
          password: ${{ secrets.NAUKRI_PASSWORD_MAIN }}
          profile_id: ${{ secrets.NAUKRI_PROFILE_ID_MAIN }}
          resume_path: ./resumes/Abhimanyu_Prasad_J.pdf
