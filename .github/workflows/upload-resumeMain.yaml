name: Update Naukri Resume for ProfileMAIN

on:
  schedule:
    - cron: '0 3 * * *'    # 8:30 AM IST
    - cron: '30 8 * * *'   # 2:00 PM IST
    - cron: '0 13 * * *'   # 6:30 PM IST
  workflow_dispatch:

jobs:
  upload-resume:
    runs-on: naukri-ec2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload resume to Naukri
        uses: Prateek-Wayne/naukri-resume-action@v1.2.0
        with:
          username: ${{ secrets.NAUKRI_USERNAME_MAIN }}
          password: ${{ secrets.NAUKRI_PASSWORD_MAIN }}
          profile_id: ${{ secrets.NAUKRI_PROFILE_ID_MAIN }}
          resume_path: ./resumes/Abhimanyu_Prasad_J.pdf
          profile_summary: "Backend and Full Stack Developer with 2 years of experience at TCS, specializing in Java, Spring Boot, Node.js, and TypeScript. Hands-on expertise in building scalable microservices, REST APIs, and cloud-native applications on Microsoft Azure (AKS, Cosmos DB, Azure DevOps). Proficient in Docker, Kubernetes, Helm, CI/CD pipelines, and distributed systems design. Experienced in AI/ML integration and GenAI application development using LangChain, GPT-4, RAG pipelines, and LLM fine-tuning. Built Jobify, a full-stack AI-powered job-matching platform using Spring Boot and GPT-4 embeddings. Also developed MediLink AI, a health-tech platform leveraging Spring Boot and AI-driven recommendations. Strong understanding of system design, JPA, Hibernate, SQL, and NoSQL databases. Skilled in RLHF data evaluation and prompt engineering. Actively seeking roles in Backend Development, Full Stack Development, Java Development, Spring Boot Development, Node.js Development, Cloud Engineering, Azure DevOps, AI/ML Engineering, and GenAI Application Development."
